# Render Blueprint for the Mono API.
#
# Free-tier warning: the disk is ephemeral, so the SQLite file is wiped on every
# redeploy/restart and all user data is lost. Attach a persistent disk or move to
# Postgres (set DATABASE_URL) before treating this as real.
services:
  - type: web
    name: mono-todo-api
    runtime: python
    plan: free
    # Root Directory is backend/, so requirements.txt resolves and the bare
    # imports in main.py (from database import ..., from models import ...)
    # work without extra sys.path manipulation.
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /docs
    envVars:
      - key: ENVIRONMENT
        value: production
      # generateValue gives a fresh strong secret per deploy.
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://to-do-ap-phi.vercel.app
      - key: LOGIN_RATE_LIMIT
        value: "10"
      - key: LOGIN_RATE_WINDOW
        value: "300"
      - key: REGISTER_RATE_LIMIT
        value: "5"
      - key: REGISTER_RATE_WINDOW
        value: "3600"
