# Render Blueprint for the Mono API.
#
# NOTE: the free tier uses an ephemeral disk, so SQLite data is lost on every
# redeploy/restart. Add a persistent disk or move to Postgres before real use.
services:
  - type: web
    name: mono-todo-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /docs
    envVars:
      - key: ENVIRONMENT
        value: production
      # generateValue creates a strong random secret per deploy
      - key: SECRET_KEY
        generateValue: true
      # Replace with your deployed frontend origin.
      - key: CORS_ORIGINS
        sync: false
      - key: LOGIN_RATE_LIMIT
        value: "10"
      - key: LOGIN_RATE_WINDOW
        value: "300"
      - key: REGISTER_RATE_LIMIT
        value: "5"
      - key: REGISTER_RATE_WINDOW
        value: "3600"
